events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Round-robins across three app containers by least-active-connections
    # rather than plain round-robin — a big CSV merge can tie up one
    # backend for a while, and least_conn actively steers new requests away
    # from a backend that's still busy with a previous one, instead of
    # blindly sending the "next" request to it regardless of load.
    upstream lakehouse_app {
        least_conn;
        server app1:5000;
        server app2:5000;
        server app3:5000;
    }

    # Must be >= Flask's own MAX_CONTENT_LENGTH (MAX_UPLOAD_SIZE_GB, now 10GB
    # by default, see config.py) — if this is smaller, nginx rejects an
    # oversized upload before it ever reaches Flask, with a generic nginx
    # error page instead of the app's own friendly "file is too large" JSON
    # response. Kept a bit above the Flask limit as headroom.
    client_max_body_size 15g;
    client_body_timeout 3600s;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://lakehouse_app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Werkzeug's ProxyFix (see app.py) is what actually reads the
            # X-Forwarded-* headers above on the Flask side — without both
            # halves in place, every visitor looks identical to Flask's
            # per-IP rate limiter (they'd all show up as nginx's own IP).

            # A large upload + streaming clean/merge can genuinely take a
            # long time at big-data sizes — nginx's defaults (60s) are tuned
            # for ordinary web traffic, not a multi-GB CSV upload, so these
            # are generous (2 hours) rather than merely "more than 300s".
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
    }
}
