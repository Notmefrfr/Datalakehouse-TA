events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Round-robins across three app containers by least-active-connections
    # rather than plain round-robin — a big CSV merge can tie up one
    # backend for a while, and least_conn actively steers new requests away
    # from a backend that's still busy with a previous one, instead of
    # blindly sending the "next" request to it regardless of load.
    upstream lakehouse_app {
        least_conn;
        server app1:5000;
        server app2:5000;
        server app3:5000;
    }

    # Must be >= Flask's own MAX_CONTENT_LENGTH (2GB, see config.py) — if
    # this is smaller, nginx rejects an oversized upload before it ever
    # reaches Flask, with a generic nginx error page instead of the app's
    # own friendly "file is too large" JSON response.
    client_max_body_size 2100m;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://lakehouse_app;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Werkzeug's ProxyFix (see app.py) is what actually reads the
            # X-Forwarded-* headers above on the Flask side — without both
            # halves in place, every visitor looks identical to Flask's
            # per-IP rate limiter (they'd all show up as nginx's own IP).

            # A large upload + Spark merge can genuinely take a while —
            # nginx's defaults (60s) are tuned for ordinary web traffic,
            # not a multi-hundred-MB CSV merge.
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
